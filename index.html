<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kayla's Kitchen: 50 Southern comfort classics with step-by-step cook mode, herbs and spices guide, cooking methods, lessons and a cooking journal.">
<meta name="theme-color" content="#2D5B44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kayla's Kitchen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kayla's Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Gingham-tablecloth header, card lists, bottom tab bar, full-screen sheets for recipes and cook mode. */
:root{
  --bg:#F3F5EE; --surface:#FFFFFF; --surface-2:#E7ECE1; --ink:#1D2822; --muted:#56655C; --line:#D5DCCE;
  --collard:#2D5B44; --on-collard:#FFFFFF; --cornmeal:#B98208; --cornmeal-soft:#F6E8C3; --pepper:#B3442C; --plum:#86476A; --good:#2F7D4F;
  --ging:rgba(45,91,68,.15); --shadow:0 12px 32px rgba(20,35,27,.16);
  --display:"Corben",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101713; --surface:#18211C; --surface-2:#222D27; --ink:#E6ECE3; --muted:#9BA89F; --line:#2D3A33;
  --collard:#7DC19B; --on-collard:#0E1612; --cornmeal:#E7B43C; --cornmeal-soft:#37301F; --pepper:#E58066; --plum:#D69ABD; --good:#6FC793;
  --ging:rgba(125,193,155,.13); --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101713; --surface:#18211C; --surface-2:#222D27; --ink:#E6ECE3; --muted:#9BA89F; --line:#2D3A33;
  --collard:#7DC19B; --on-collard:#0E1612; --cornmeal:#E7B43C; --cornmeal-soft:#37301F; --pepper:#E58066; --plum:#D69ABD; --good:#6FC793;
  --ging:rgba(125,193,155,.13); --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--cornmeal);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Header */
.hero{background-color:var(--bg);background-image:repeating-linear-gradient(0deg,var(--ging) 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,var(--ging) 0 14px,transparent 14px 28px);border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:22px 20px}
.herorow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.installbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;background:var(--collard);color:var(--on-collard);font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.installbtn svg{width:18px;height:18px}
.plate{display:inline-flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;box-shadow:0 2px 0 var(--line)}
.plate h1{font-size:28px;color:var(--collard)}
.plate p{margin:0;color:var(--muted);font-size:13.5px}

.section{display:grid;gap:14px;padding-block:20px 8px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:22px}

/* Controls */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--collard);border-color:var(--collard);color:var(--on-collard)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-width:0}
.card:hover{border-color:var(--collard)}
.card h3{font-size:16.5px}
.card .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cat{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.Mains{background:var(--pepper)} .dot.Sides{background:var(--collard)} .dot.Breads{background:var(--cornmeal)} .dot.Desserts{background:var(--plum)} .dot.Drinks{background:var(--muted)}
.diff{display:inline-flex;gap:2px;align-items:center}
.diff i{width:4px;height:10px;border-radius:2px;background:var(--line);display:block}
.diff i.on{background:var(--cornmeal)}
.flags{display:flex;gap:6px;margin-left:auto}
.flag{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px}
.flag.cooked{background:var(--collard);color:var(--on-collard)}
.flag.saved{border:1px solid var(--pepper);color:var(--pepper)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}

.next{display:grid;gap:4px;background:var(--cornmeal-soft);border-radius:14px;padding:14px 16px;text-align:left;border:0}
.next strong{font-family:var(--display);font-size:18px}

/* Pills used for techniques and spices */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.pill.herb{border-color:var(--collard);color:var(--collard)}
.pill.tech{border-color:var(--cornmeal);color:var(--ink);background:var(--cornmeal-soft)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.Herb{background:var(--collard);color:var(--on-collard)} .tag.Blend{background:var(--cornmeal-soft);color:var(--ink)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:9px 2px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--collard)}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{color:var(--pepper);border-color:var(--pepper)}
.sheet-bar .title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{display:grid;gap:22px;padding-block:20px calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-body h1{font-size:30px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 11px;display:grid;font-size:13px}
.fact b{font-family:var(--mono);font-weight:500;font-size:15px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.tip{background:var(--cornmeal-soft);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.tip p{margin:0}
.block{display:grid;gap:10px}
.block h2{font-size:19px}
.ings{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ings li+li{border-top:1px solid var(--line)}
.ings label{display:grid;grid-template-columns:22px 92px 1fr;gap:10px;align-items:start;padding:10px 12px;cursor:pointer}
.ings input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--collard)}
.ings .amt{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.ings input:checked ~ span{text-decoration:line-through;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--collard);color:var(--on-collard);display:grid;place-items:center;font-weight:700;font-size:14px}
.steps p{margin:0}
.timerpill{display:inline-block;margin-top:4px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:15.5px;background:var(--collard);color:var(--on-collard);text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:9px 13px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn:first-child{grid-column:1/-1}

/* Cook mode */
.cook{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.cook-top{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.cook-top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.bar{height:5px;background:var(--surface-2)}
.bar span{display:block;height:100%;background:var(--cornmeal);transition:width .3s}
.cook-main{flex:1;overflow-y:auto}
.cook-main .wrap{display:grid;gap:18px;padding-block:22px}
.cook-step{font-size:22px;line-height:1.45;font-weight:500;margin:0;max-width:34ch}
.timer{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.timer .big{font-family:var(--mono);font-size:46px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.timer.done{border-color:var(--pepper)} .timer.done .big{color:var(--pepper)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--cornmeal-soft);border:0;border-radius:10px;padding:9px 12px;width:100%;text-align:left;font-weight:600}
.cook-foot{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook-foot .wrap{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:12px}
details.ingdrawer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.ingdrawer summary{font-weight:700;cursor:pointer}
details.ingdrawer ul{margin:8px 0 0;padding-left:18px}

/* Learn */
.level{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.level-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.level h3{font-size:18px}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--collard)}
.pathlist{display:flex;flex-wrap:wrap;gap:6px}
.pathlist button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.pathlist button.done{background:var(--collard);border-color:var(--collard);color:var(--on-collard)}
.lesson p{margin:0}
.eli{font-size:17px;line-height:1.55;max-width:62ch}
.points{margin:0;padding-left:20px;display:grid;gap:6px;max-width:62ch}
.quiz{display:grid;gap:8px}
.quiz button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;font-weight:600}
.quiz button.right{border-color:var(--good);color:var(--good)}
.quiz button.wrong{border-color:var(--pepper);color:var(--pepper)}
.quiz .fb{font-weight:700}

/* Spices */
.spice h3{font-size:16.5px}
.spice p{margin:0;font-size:13.5px;color:var(--muted)}
.rank{display:grid;gap:8px}
.rank button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.rank b{font-family:var(--display);font-size:16px}
.rank small{grid-column:1/-1;color:var(--muted);font-size:13px}
.dish{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dish > button{border:0;background:none;padding:0;text-align:left;font-family:var(--display);font-weight:700;font-size:16px}

/* Kitchen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:24px;font-weight:500}
.stat span{font-size:12.5px;color:var(--muted)}
.shop{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.shop li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 12px}
.shop li+li{border-top:1px solid var(--line)}
.shop input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--collard)}
.shop small{display:block;color:var(--muted);font-size:12px}
.shop input:checked + label{text-decoration:line-through;color:var(--muted)}
.shop .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.copyfall{width:100%;min-height:140px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px}

/* Meal planner */
.weeknav{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.weeknav div{display:grid;gap:2px}
.weeknav b{font-family:var(--display);font-size:17px}
.weeknav span{font-size:12.5px}
.iconbtn.flip svg{transform:scaleX(-1)}
.days{display:grid;gap:10px}
.daycard{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.daycard.today{border-color:var(--collard);box-shadow:inset 0 0 0 1px var(--collard)}
.dayhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dayhead b{font-family:var(--display);font-size:16.5px}
.planlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.planlist li{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.pl-main{display:grid;gap:1px;min-width:0}
.pl-name{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:15px;color:var(--ink)}
.ahead{color:var(--pepper);font-weight:600}
.planlist .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.adddish{justify-self:start;border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--collard)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.for{display:block;color:var(--muted);font-size:12px}
/* Cook-along video */
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidblock{gap:8px}
.vidcard{position:relative;display:block;width:100%;max-width:640px;aspect-ratio:16/9;border:0;padding:0;border-radius:14px;overflow:hidden;text-decoration:none;cursor:pointer;
  background:radial-gradient(120% 90% at 85% 15%,rgba(255,255,255,.14),transparent 60%),linear-gradient(135deg,#2D5B44,#1B3A2B);color:#fff;text-align:left;box-shadow:0 4px 14px rgba(20,35,27,.18)}
.vidcard:hover .vc-play,.vidcard:focus-visible .vc-play{transform:translate(-50%,-50%) scale(1.08)}
.vc-thumb,.vc-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vc-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72))}
.vc-play{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#E7B43C;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s}
.vc-play .tri{width:0;height:0;margin-left:5px;border-left:20px solid #1D2822;border-top:12px solid transparent;border-bottom:12px solid transparent}
.vc-text{position:absolute;left:14px;right:14px;bottom:12px;display:grid;gap:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vc-kicker{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F6E8C3}
.vc-title{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc-ch{font-size:13px;opacity:.9}
.vidblock .player{max-width:640px}
.vidtag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--pepper)}
.vidtag .tri{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
@media (max-width:420px){.vc-play{width:54px;height:54px}.vc-title{font-size:15.5px}}
.vidplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:var(--collard);color:var(--on-collard);padding:10px 16px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.vidplay .tri{width:0;height:0;border-left:12px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
a.btn{text-decoration:none;display:inline-block}
a.mini{text-decoration:none;color:var(--ink)}
.vidbar{display:grid;gap:8px;padding-block:8px}
.vidbar .player{max-height:34vh;aspect-ratio:16/9;margin-inline:auto;width:auto;height:min(34vh,56vw)}
/* Journal form */
.logform{display:grid;gap:16px;max-width:640px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:700;font-size:14px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
textarea.inp{resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ingrows{display:grid;gap:8px}
.ingrow{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) 32px;gap:8px;align-items:center}
.ingrow.head span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ingrow .x,.shop .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:30px;line-height:1;padding:2px;color:var(--line)}

const TECHNIQUES = [
{id:"roux",n:"Making a Roux",eli:"A roux is flour cooked in fat. Raw flour tastes like paste, so you cook it first. The longer you stir, the darker and nuttier it gets, but the less it thickens.",pts:["Use about equal parts fat and flour.","A blond roux (2–15 minutes) thickens gravy and mac and cheese. A dark roux (30–45 minutes) flavors gumbo.","Stir the whole time. Black specks mean it burned, so start over."],q:"Which roux thickens the most?",o:["A light blond roux","A dark chocolate-brown roux","They thicken the same"],a:0},
{id:"trinity",n:"The Holy Trinity",eli:"Onion, celery and green bell pepper, chopped and cooked together. It's the flavor base of Cajun and Creole food, like the French use onion, celery and carrot.",pts:["Dice everything about the same size so it cooks evenly.","A rough ratio is 2 parts onion to 1 part celery to 1 part pepper.","Adding it to a hot roux stops the roux from browning further."],q:"In the trinity, green bell pepper takes the place of which French vegetable?",o:["Garlic","Carrot","Okra"],a:1},
{id:"dredge",n:"Dredging",eli:"Dredging means coating food in something dry, then wet, then dry again, so a crunchy crust sticks to it when you fry.",pts:["Use one hand for dry and one for wet so your fingers don't get clumpy.","Press the coating on firmly.","Let coated pieces rest 10–15 minutes so the coating sets and won't fall off in the oil."],q:"Why rest coated chicken before frying?",o:["Only to warm it up","So the coating sets and sticks","To dry out the meat"],a:1},
{id:"fry",n:"Frying Temperature",eli:"Oil for frying sits between 325°F and 375°F. Too cold and food soaks up oil and turns greasy. Too hot and the outside burns before the inside cooks.",pts:["Use a clip-on thermometer. No thermometer? A bread cube browns in about 60 seconds at 350°F.","Fry in small batches so the temperature doesn't crash.","Drain on a wire rack and salt right away. Never put water on a grease fire; cover it with a lid."],q:"Your fried chicken came out greasy. What's the most likely cause?",o:["The oil was too cold","The oil was too hot","Too much salt"],a:0},
{id:"biscuit",n:"The Biscuit Method",eli:"Bits of cold butter are mixed into flour. In the hot oven, the butter melts and turns to steam, which puffs up flaky layers.",pts:["Keep the butter and buttermilk cold. Freeze the butter 15 minutes if your kitchen is warm.","Mix only until it holds together. Overworked dough makes tough biscuits.","Cut straight down. Twisting the cutter seals the edges and stops the rise."],q:"Why do biscuits need cold butter?",o:["It turns to steam in the oven and makes layers","It makes the dough sweeter","Warm butter is unsafe"],a:0},
{id:"braise",n:"Braising and Smothering",eli:"Brown the meat, then cook it slowly, covered, in a little liquid until tough meat turns tender. Smothering is the Southern version, usually in onion gravy.",pts:["Brown the meat well. Those browned bits flavor the sauce.","The liquid comes partway up the meat, not over it.","Keep it at a bare simmer, not a boil, so the meat stays juicy."],q:"What should the liquid be doing while you braise?",o:["Rolling boil","Gentle, barely bubbling simmer","Nothing; the heat is off"],a:1},
{id:"lowslow",n:"Low and Slow Barbecue",eli:"Tough cuts like pork shoulder are full of connective tissue. Hours at low heat melt it into gelatin, which makes the meat tender and juicy.",pts:["Cook to internal temperature and feel, not to time.","The temperature often stalls around 160°F for hours. Wrapping the meat in foil or paper pushes it through.","Rest the meat 30 minutes or more before pulling it."],q:"Pulled pork is ready to shred at about:",o:["145°F","165°F","200°F"],a:2},
{id:"custard",n:"Custards and Puddings",eli:"Eggs set when they heat up. Gentle heat makes them smooth and creamy. Too much heat scrambles them.",pts:["On the stove, stir constantly and scrape the bottom corners.","Temper eggs by whisking in a little hot liquid before adding them to the pot.","Pies are done when the edges are set and the center still jiggles a little. They firm up as they cool."],q:"A pecan pie is done when:",o:["The center is completely firm","The edges are set and the center jiggles slightly","The crust turns dark brown"],a:1},
{id:"cream",n:"Creaming Butter and Sugar",eli:"Beating soft butter with sugar traps tiny air bubbles. Those bubbles are what make a pound cake rise light instead of heavy.",pts:["Butter should be soft but cool, about 65°F. It dents when you press it.","Beat 5–7 minutes, until pale and fluffy.","Add eggs one at a time, and add dry and wet ingredients in turns so the batter doesn't split."],q:"How long should you cream butter and sugar for pound cake?",o:["30 seconds","5–7 minutes","Overnight"],a:1},
{id:"castiron",n:"Cast-Iron Care",eli:"Seasoning is layers of oil baked onto the iron. It makes the skillet naturally nonstick and gets better the more you cook in it.",pts:["Preheat the skillet. Hot iron gives cornbread its crunchy crust.","Wash with hot water and a brush (a little soap is fine). Dry it on the burner and wipe on a thin coat of oil.","Avoid long simmers of acidic food like tomato sauce in a newer pan."],q:"After washing a cast-iron skillet, you should:",o:["Let it air-dry in the rack","Dry it on the heat and rub in a thin coat of oil","Soak it overnight"],a:1},
{id:"gravy",n:"Pan Gravy",eli:"Gravy starts as a roux made from the drippings left in the pan. Add milk for cream gravy, or stock for brown gravy.",pts:["Keep the browned bits in the pan. They're the flavor.","Pour the liquid in slowly while whisking to avoid lumps.","Gravy thickens as it cools, so stop when it's a little thinner than you want. Use plenty of black pepper."],q:"How do you avoid lumpy gravy?",o:["Dump all the milk in at once","Add the liquid slowly while whisking","Skip the flour"],a:1},
{id:"potliquor",n:"Pot Liquor",eli:"Pot liquor is the rich, smoky broth left after simmering greens or beans with smoked meat. It's full of flavor and nutrients.",pts:["Simmer the smoked meat first to build the broth before the greens go in.","Wash greens until there's no grit left in the sink.","A splash of vinegar and a pinch of sugar balance the bitterness."],q:"What's pot liquor traditionally eaten with?",o:["Cornbread","Ice cream","Pound cake"],a:0},
{id:"grits",n:"Cooking Grits",eli:"Grits are ground dried corn. Stone-ground grits are coarse and need 30–45 minutes of slow simmering. Instant grits are fast but have less flavor.",pts:["Use about 4 parts liquid to 1 part grits.","Whisk the grits in slowly to prevent lumps.","Stir often and add hot water if they get stiff. Finish with butter and salt."],q:"What's the usual liquid-to-grits ratio?",o:["1 to 1","4 to 1","10 to 1"],a:1}

<script>
(function(){
const $=s=>document.querySelector(s);
const R=Object.fromEntries(RECIPES.map(r=>[r.id,r]));
const T=Object.fromEntries(TECHNIQUES.map(t=>[t.id,t]));
const S=Object.fromEntries(SPICES.map(s=>[s.id,s]));
const PR=Object.fromEntries(PROTEINS.map(p=>[p.id,p]));
const M=Object.fromEntries(METHODS.map(m=>[m.id,m]));
const CATS=["All","Mains","Sides","Breads & Breakfast","Desserts","Drinks"];

let store={fav:[],cooked:{},shop:[],quiz:{},journal:[],plan:{}};
try{const v=localStorage.getItem("kk.v1");if(v)store=Object.assign(store,JSON.parse(v));}catch(e){}
if(!Array.isArray(store.journal))store.journal=[];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("kk.v1",JSON.stringify(store));}catch(e){}}

if(!store.plan||typeof store.plan!=="object"||Array.isArray(store.plan))store.plan={};
const state={planWeek:null,tab:"recipes",q:"",cat:"All",easy:false,smode:"spice",stype:"All",protein:"chicken",stack:[],serv:{},checked:{},cook:null,timer:null,copyText:null};

const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-9a4.6 4.6 0 0 1 9-2.3A4.6 4.6 0 0 1 21 11c-2 4.6-9 9-9 9z"/></svg>',
  heartOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-9a4.6 4.6 0 0 1 9-2.3A4.6 4.6 0 0 1 21 11c-2 4.6-9 9-9 9z"/></svg>'
};

/* ---------- formatting ---------- */
function fmtTime(m){if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" hr"+(r?" "+r+" min":"");}
function fmtClock(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,"0");return h?h+":"+p(m)+":"+p(x):p(m)+":"+p(x);}
const FR=[[0,""],[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"],[1,""]];
function fmtQty(q){
  if(q>=10)return String(Math.round(q));
  let w=Math.floor(q),f=q-w,best=FR[0];
  for(const c of FR){if(Math.abs(c[0]-f)<Math.abs(best[0]-f))best=c;}
  if(best[0]===1){w+=1;best=FR[0];}
  if(!w&&!best[1])return "pinch";
  return (w?String(w):"")+best[1];
}
const PL={cup:"cups",slice:"slices",sprig:"sprigs",can:"cans",jar:"jars",box:"boxes",sleeve:"sleeves"};
function amount(ing,f){const q=ing[0]*f;const a=fmtQty(q);let u=ing[1];if(u&&q>1.01&&PL[u])u=PL[u];if(a==="pinch")return "pinch";return u?a+" "+u:a;}
function factor(r){return (state.serv[r.id]||r.s)/r.s;}
const DIFF=["","Easy","Medium","Project"];
function diffBars(d){return '<span class="diff" aria-label="'+DIFF[d]+'"><i class="on"></i><i class="'+(d>1?"on":"")+'"></i><i class="'+(d>2?"on":"")+'"></i></span>';}
function dotClass(c){return c.split(" ")[0];}

/* ---------- components ---------- */
function card(r){
  const cooked=store.cooked[r.id],fav=store.fav.includes(r.id);
  return '<button class="card" data-act="open-recipe" data-id="'+r.id+'">'+
    '<span class="eyebrow cat"><span class="dot '+dotClass(r.c)+'"></span>'+r.c+'</span>'+
    '<h3>'+r.n+'</h3>'+(VIDEOS[r.id]?'<span class="vidtag"><span class="tri"></span>Cook-along video · '+VIDEOS[r.id].m+' min</span>':'')+
    '<span class="meta"><span class="mono">'+fmtTime(r.t)+'</span><span>'+diffBars(r.d)+' '+DIFF[r.d]+'</span>'+
    '<span class="flags">'+(fav?'<span class="flag saved">Saved</span>':'')+(cooked?'<span class="flag cooked">Cooked</span>':'')+'</span></span>'+
  '</button>';
}
function spicePills(ids){return ids.map(id=>'<button class="pill herb" data-act="open-spice" data-id="'+id+'">'+S[id].n+'</button>').join("");}
function techPills(ids){return ids.map(id=>'<button class="pill tech" data-act="open-tech" data-id="'+id+'">'+T[id].n+'</button>').join("");}
function dishesForSpice(id){return RECIPES.filter(r=>r.sp.includes(id));}

/* ---------- tabs ---------- */
function nextOnPath(){
  for(let i=0;i<PATH.length;i++){for(const id of PATH[i].r){if(!store.cooked[id])return {r:R[id],lvl:i+1,name:PATH[i].n};}}
  return null;
}
function filtered(){
  const q=state.q.trim().toLowerCase();
  return RECIPES.filter(r=>(state.cat==="All"||r.c===state.cat)&&(!state.easy||r.d===1)&&
    (!q||r.n.toLowerCase().includes(q)||r.i.some(x=>x[2].toLowerCase().includes(q))||r.sp.some(s=>S[s].n.toLowerCase().includes(q))));
}
function listHTML(){
  const list=filtered();
  if(!list.length)return '<div class="empty">No recipes match that. Try another word or clear the filters.</div>';
  return '<div class="grid">'+list.map(card).join("")+'</div>';
}
function viewRecipes(){
  const nx=nextOnPath();
  return '<section class="section">'+
    (nx?'<button class="next" data-act="open-recipe" data-id="'+nx.r.id+'"><span class="eyebrow">Next on your path · Level '+nx.lvl+', '+nx.name+'</span><strong>'+nx.r.n+'</strong><span class="muted">'+fmtTime(nx.r.t)+' · '+DIFF[nx.r.d]+'</span></button>':'')+
    '<div class="section-head"><h2>The recipe box</h2><span class="muted mono">'+RECIPES.length+' recipes</span></div>'+
    '<input class="search" id="q" type="search" placeholder="Search a dish, ingredient or spice" value="'+state.q.replace(/"/g,"&quot;")+'" aria-label="Search recipes">'+
    '<div class="chips" role="group" aria-label="Category">'+CATS.map(c=>'<button class="chip" data-act="cat" data-id="'+c+'" aria-pressed="'+(state.cat===c)+'">'+c+'</button>').join("")+
    '<button class="chip" data-act="easy" aria-pressed="'+state.easy+'">Easy only</button></div>'+
    '<div id="list">'+listHTML()+'</div></section>';
}
function viewSpices(){
  let h='<section class="section"><div class="section-head"><h2>Herbs, spices &amp; methods</h2></div>'+
    '<p class="muted" style="margin:0;max-width:60ch">Start from a seasoning to see the dishes it belongs in, from a protein to see what to season it with, or from a cooking method to learn the temperatures, best practices and spice blends.</p>'+
    '<span class="eyebrow">Start with</span><div class="seg" role="group" aria-label="Start with"><button data-act="smode" data-id="spice" aria-pressed="'+(state.smode==="spice")+'">A seasoning</button><button data-act="smode" data-id="protein" aria-pressed="'+(state.smode==="protein")+'">A protein</button><button data-act="smode" data-id="method" aria-pressed="'+(state.smode==="method")+'">A method</button></div>';
  if(state.smode==="method"){
    h+='<div class="grid">'+METHODS.map(m=>{const n=RECIPES.filter(r=>METHOD_OF[r.id]===m.id).length,a=Object.values(ALT).filter(l=>l.some(x=>x[0]===m.id)).length;
      return '<button class="card" data-act="open-method" data-id="'+m.id+'"><span class="eyebrow">'+n+' recipes · '+a+' swaps</span><h3>'+m.n+'</h3><span class="muted" style="font-size:13.5px">'+m.eli.split(". ")[0]+'.</span></button>';}).join("")+'</div>';
  }else if(state.smode==="spice"){
    const types=["All","Herb","Spice","Blend"];
    h+='<div class="chips" role="group" aria-label="Type">'+types.map(t=>'<button class="chip" data-act="stype" data-id="'+t+'" aria-pressed="'+(state.stype===t)+'">'+(t==="All"?"All":t+"s")+'</button>').join("")+'</div>';
    const list=SPICES.filter(s=>state.stype==="All"||s.t===state.stype);
    h+='<div class="grid">'+list.map(s=>{const n=dishesForSpice(s.id).length;return '<button class="card spice" data-act="open-spice" data-id="'+s.id+'"><span class="row" style="justify-content:space-between"><span class="tag '+s.t+'">'+s.t+'</span><span class="mono muted" style="font-size:12.5px">'+n+' dish'+(n===1?"":"es")+'</span></span><h3>'+s.n+'</h3><p>'+s.f+'</p></button>';}).join("")+'</div>';
  }else{
    const p=state.protein;
    h+='<div class="chips" role="group" aria-label="Protein">'+PROTEINS.map(x=>'<button class="chip" data-act="prot" data-id="'+x.id+'" aria-pressed="'+(p===x.id)+'">'+x.n+'</button>').join("")+'</div>';
    const dishes=RECIPES.filter(r=>r.p===p);
    const count={};dishes.forEach(r=>r.sp.forEach(s=>count[s]=(count[s]||0)+1));
    const ranked=SPICES.filter(s=>s.best.includes(p)||count[s.id]).sort((a,b)=>(count[b.id]||0)-(count[a.id]||0)||a.n.localeCompare(b.n));
    h+='<div class="block"><h2>Best seasonings for '+PR[p].n.toLowerCase()+'</h2><div class="rank">'+ranked.map(s=>'<button data-act="open-spice" data-id="'+s.id+'"><b>'+s.n+'</b><span class="tag '+s.t+'">'+s.t+'</span><small>'+(count[s.id]?'In '+count[s.id]+' of these dishes. ':'')+s.use+'</small></button>').join("")+'</div></div>';
    h+='<div class="block"><h2>'+PR[p].n+' dishes and their seasonings</h2>'+dishes.map(r=>'<div class="dish"><button data-act="open-recipe" data-id="'+r.id+'">'+r.n+'</button>'+(r.sp.length?'<div class="pills">'+spicePills(r.sp)+'</div>':'<span class="muted" style="font-size:13.5px">No added spices. This one is about technique.</span>')+'</div>').join("")+'</div>';
  }
  return h+'</section>';
}
function viewLearn(){
  let h='<section class="section"><div class="section-head"><h2>Your learning path</h2></div><p class="muted" style="margin:0;max-width:60ch">Four levels, six dishes each. Cook them in order and each one teaches a skill the next one needs.</p>';
  PATH.forEach((l,i)=>{const done=l.r.filter(id=>store.cooked[id]).length;
    h+='<div class="level"><div class="level-head"><h3>Level '+(i+1)+': '+l.n+'</h3><span class="mono muted">'+done+'/'+l.r.length+'</span></div><div class="prog"><span style="width:'+(done/l.r.length*100)+'%"></span></div><p class="muted" style="margin:0">'+l.d+'</p><div class="pathlist">'+l.r.map(id=>'<button class="'+(store.cooked[id]?"done":"")+'" data-act="open-recipe" data-id="'+id+'">'+R[id].n+'</button>').join("")+'</div></div>';});
  const passed=Object.keys(store.quiz).length;
  h+='<div class="section-head" style="margin-top:8px"><h2>Techniques</h2><span class="mono muted">'+passed+'/'+TECHNIQUES.length+' passed</span></div><div class="grid">'+
    TECHNIQUES.map(t=>{const n=RECIPES.filter(r=>r.k.includes(t.id)).length;return '<button class="card" data-act="open-tech" data-id="'+t.id+'"><span class="eyebrow">'+(store.quiz[t.id]?'Passed':'Lesson')+' · '+n+' recipes</span><h3>'+t.n+'</h3><span class="muted" style="font-size:13.5px">'+t.eli.split(". ")[0]+'.</span></button>';}).join("")+'</div>';
  return h+'</section>';
}
function viewKitchen(){
  const cooked=Object.keys(store.cooked).length;
  let h='<section class="section"><div class="section-head"><h2>My kitchen</h2></div>'+
    '<div class="stats"><div class="stat"><b>'+cooked+'<span class="muted" style="font-size:14px">/50</span></b><span>Dishes cooked</span></div><div class="stat"><b>'+store.fav.length+'</b><span>Saved</span></div><div class="stat"><b>'+Object.keys(store.quiz).length+'<span class="muted" style="font-size:14px">/'+TECHNIQUES.length+'</span></b><span>Lessons passed</span></div></div>';
  h+='<div class="block"><div class="section-head"><h2>Cooking journal</h2><span class="mono muted">'+store.journal.length+' meals</span></div>'+
    '<p class="muted" style="margin:0;max-width:60ch">Your record of every meal you make: what went in, how much, how long it took, and what you\'d change next time.</p>'+
    '<div class="row"><button class="btn small" data-act="log-new">Log a meal</button>'+(store.journal.length?'<button class="btn small ghost" data-act="journal-copy">Copy journal</button>':'')+'</div>'+
    (store.journal.length?journalList(store.journal):'<div class="empty">No meals logged yet. Tap "Log a meal," or finish any recipe in cook mode and the entry starts itself.</div>')+'</div>';
  h+='<div class="block"><div class="section-head"><h2>Shopping list</h2><span class="mono muted">'+store.shop.length+' items</span></div>';

function beep(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t0=audio.currentTime;[0,.35,.7].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.3,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.28);o.start(t0+d);o.stop(t0+d+.3);});}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}}
function tick(){

}

/* ---------- meal planner ---------- */
const DAYNAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function isoOf(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function shortDate(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function curWeek(){if(!state.planWeek)state.planWeek=isoOf(mondayOf(new Date()));return state.planWeek;}
function weekDays(){const m=parseISO(curWeek());return [0,1,2,3,4,5,6].map(i=>isoOf(addDays(m,i)));}
function dayList(iso){return (store.plan[iso]||[]).filter(e=>R[e.rid]);}
function planEntries(days){return days.flatMap(d=>dayList(d).map(e=>({day:d,rid:e.rid,serv:e.serv})));}
function addToPlan(day,rid,serv){(store.plan[day]=store.plan[day]||[]).push({rid,serv:serv||R[rid].s});save();}
function pruneOldPlan(){/* keep the plan from growing forever: drop days older than 8 weeks */const cut=isoOf(addDays(new Date(),-56));Object.keys(store.plan).forEach(k=>{if(k<cut||!store.plan[k].length)delete store.plan[k];});}

/* Fill empty days: a main plus a side each day, quicker mains on weeknights, no repeats, no same protein two days running, dessert on Sunday. */
function autoFill(){
  const days=weekDays();const used=new Set(planEntries(days).map(e=>e.rid));let filled=0,lastP=null;
  const pick=(pool)=>pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  days.forEach((d,i)=>{
    const cur=dayList(d);if(cur.length){const m=cur.map(e=>R[e.rid]).find(r=>r.c==="Mains");lastP=m?m.p:lastP;return;}
    const weekday=i<5;const mains=RECIPES.filter(r=>r.c==="Mains"&&!used.has(r.id));
    let m=pick(mains.filter(r=>r.p!==lastP&&(!weekday||(r.t<=120&&!r.w&&r.d<=2))))||pick(mains.filter(r=>r.p!==lastP))||pick(mains)||pick(RECIPES.filter(r=>r.c==="Mains"));
    if(!m)return;addToPlan(d,m.id);used.add(m.id);lastP=m.p;
    const sides=RECIPES.filter(r=>(r.c==="Sides"||r.id==="skillet-cornbread"||r.id==="biscuits")&&!used.has(r.id)&&(!weekday||r.t<=90));
    const s=pick(sides)||pick(RECIPES.filter(r=>r.c==="Sides"));if(s){addToPlan(d,s.id);used.add(s.id);}
    if(i===6){const ds=pick(RECIPES.filter(r=>r.c==="Desserts"&&!used.has(r.id)));if(ds){addToPlan(d,ds.id);used.add(ds.id);}}
    filled++;
  });
  return filled;
}

/* ---------- grocery list ---------- */
const STAPLES=["salt","black pepper","oil","sugar","flour","baking powder","baking soda","shortening","water"];
const SPICEWORDS=["paprika","cayenne","cinnamon","nutmeg","thyme","bay lea","sage","old bay","cajun","seasoning","pepper flakes","celery seed","allspice","garlic powder","onion powder","vanilla","cocoa","food coloring","filé"];
const PANTRYWORDS=["stock","broth","syrup","cracker","wafer","cornmeal","cornstarch","paste","sauce","vinegar","mustard","mayonnaise","relish","ketchup","pimento","panko","crumb","rice","grits","macaroni","dried","pecan","pickle","tea bag","evaporated","hot sauce","worcestershire"];
const MEATWORDS=["chicken","beef","pork","sausage","andouille","bacon","ham","turkey","oxtail","steak","shrimp","crawfish","catfish","salmon","fillet"];
const DAIRYWORDS=["buttermilk","milk","butter","egg","cheese","cheddar","colby","cream","yolk","pie crust","whipped"];
const BAKERYWORDS=["bread","rolls","biscuits","cornbread"];
const AISLES=["Meat & Seafood","Produce","Dairy & Refrigerated","Bakery","Frozen","Pantry","Spices & Seasonings","Pantry staples (check first)"];
function cleanItem(s){let n=s.replace(/\([^)]*\)/g,"").split(",")[0].replace(/\b(divided|for frying|to brush|for brushing|optional)\b/gi,"").replace(/\s+/g," ").trim();return n;}
function aisleOf(name,unit){
  const n=name.toLowerCase(),has=a=>a.some(k=>n.includes(k));
  const word=a=>a.some(k=>new RegExp("\\b"+k+"\\b").test(n)); /* whole words, so "boiled" is not "oil" */
  if(n.includes("seasoning salt"))return "Spices & Seasonings";
  if(word(STAPLES)&&!has(["cornmeal","powdered sugar","cornstarch","crackers","eggs"]))return "Pantry staples (check first)";
  if(["can","jar","box","sleeve"].includes(unit))return "Pantry";
  if(unit==="sprig")return "Produce";
  if(has(["frozen"]))return "Frozen";
  if(has(BAKERYWORDS)&&!has(["crumb"]))return "Bakery";
  if(has(PANTRYWORDS)||has(["crackers","cornstarch"]))return "Pantry";
  if(has(MEATWORDS))return "Meat & Seafood"; /* before spices: "sausage" contains "sage" */
  if(has(SPICEWORDS))return "Spices & Seasonings";
  if(has(DAIRYWORDS))return "Dairy & Refrigerated";
  if(has(["onion","garlic","celery","pepper","carrot","potato","tomato","okra","cabbage","collard","lemon","banana","peach","squash","corn","bean","lettuce","pea"]))return "Produce";
  return "Pantry";
}
function buildGrocery(days){
  const acc={};
  planEntries(days).forEach(e=>{const r=R[e.rid],f=Number(e.serv||r.s)/r.s;
    r.i.forEach(x=>{const name=cleanItem(x[2]);if(/^(cold )?water$/i.test(name))return;
      const key=name.toLowerCase()+"|"+x[1];const a=acc[key]=acc[key]||{name:name.charAt(0).toUpperCase()+name.slice(1),unit:x[1],q:0,dishes:new Set()};
      a.q+=x[0]*f;a.dishes.add(r.n);});});
  let lines=Object.values(acc).map(a=>{
    let amt;if(!a.unit){amt=String(Math.max(1,Math.ceil(a.q-0.01)));}  /* whole items: round up to what you can buy */
    else{const t=fmtQty(a.q);let u=a.unit;if(a.q>1.01&&PL[u])u=PL[u];amt=t==="pinch"?"pinch":t+" "+u;}
    return {name:a.name,amt,aisle:aisleOf(a.name,a.unit),dishes:[...a.dishes]};});
  /* one line per ingredient: the same item measured two ways reads "1 cup + 2" */
  const merged={};lines.forEach(l=>{const k=l.name.toLowerCase();const m=merged[k];
    if(!m)merged[k]={...l,dishes:[...l.dishes]};else{m.amt+=" + "+l.amt;l.dishes.forEach(x=>{if(!m.dishes.includes(x))m.dishes.push(x);});}});
  lines.length=0;lines.push(...Object.values(merged));
  lines.sort((a,b)=>AISLES.indexOf(a.aisle)-AISLES.indexOf(b.aisle)||a.name.localeCompare(b.name));
  return lines;
}
function groceryText(lines,label){return "Kayla's Kitchen grocery list · "+label+"\n"+AISLES.map(a=>{const g=lines.filter(l=>l.aisle===a);return g.length?"\n"+a+"\n"+g.map(l=>"[ ] "+l.name+" — "+l.amt).join("\n"):"";}).join("")+"\n";}
function sheetGrocery(t){
  const days=weekDays(),lines=buildGrocery(days),ents=planEntries(days);
  const label="week of "+shortDate(parseISO(days[0]));
  return '<div class="eyebrow">Meal planner</div><h1>Grocery list</h1><p class="muted" style="margin:0">Everything for '+ents.length+' planned dish'+(ents.length===1?'':'es')+', '+label+', combined and sorted by aisle. Amounts are scaled to your servings.</p>'+
    '<div class="row"><button class="btn small" data-act="grocery-send">Add all to my shopping list</button><button class="btn small ghost" data-act="grocery-copy">Copy list</button></div>'+
    (t.copyText?'<p class="muted" style="margin:0">Copying is blocked here. Select the text below and copy it.</p><textarea class="copyfall" id="grocfall" readonly>'+esc(t.copyText)+'</textarea>':'')+
    AISLES.map(a=>{const g=lines.filter(l=>l.aisle===a);if(!g.length)return "";
      return '<div class="block"><div class="section-head"><h2>'+a+'</h2><span class="mono muted">'+g.length+'</span></div><ul class="ings">'+g.map((l,i)=>'<li><label style="grid-template-columns:22px 1fr auto"><input type="checkbox" aria-label="Got '+esc(l.name)+'"><span>'+esc(l.name)+'<small class="for">for '+esc(l.dishes.join(", "))+'</small></span><span class="amt">'+esc(l.amt)+'</span></label></li>').join("")+'</ul></div>';}).join("");
}

/* ---------- cooking journal ---------- */
function isoToday(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function niceDate(iso){if(!iso)return "";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
function stars(n){return n?"★".repeat(n)+"☆".repeat(5-n):"";}
function newDraft(rid,cook){
  const r=R[rid];const f=r?factor(r):1;
  return {id:null,rid:r?rid:"",name:r?r.n:"",date:isoToday(),serv:r?String(state.serv[rid]||r.s):"",
    ings:r?r.i.map(x=>({a:amount(x,f),item:x[2]})):[{a:"",item:""}],prep:"",cook:cook?String(cook):"",rating:0,notes:""};
}
function syncDraft(){
  const t=state.stack[state.stack.length-1];if(!t||t.type!=="log")return t;const d=t.draft,v=id=>{const e=document.getElementById(id);return e?e.value:"";};
  d.name=v("log-name");d.date=v("log-date");d.serv=v("log-serv");d.prep=v("log-prep");d.cook=v("log-cook");d.notes=v("log-notes");
  const sel=document.getElementById("log-rid");if(sel)d.rid=sel.value;
  const as=document.querySelectorAll("#sheet .log-a"),is=document.querySelectorAll("#sheet .log-i");
  d.ings=[...as].map((a,i)=>({a:a.value,item:is[i]?is[i].value:""}));
  return t;
}
function journalList(es){
  return '<div class="rank">'+es.map(e=>{const bits=[];if(e.cook)bits.push("Cook "+e.cook+" min");if(e.prep)bits.push("Prep "+e.prep+" min");if(e.serv)bits.push("Serves "+e.serv);
    const note=e.notes?(e.notes.length>90?e.notes.slice(0,90)+"…":e.notes):"";
    return '<button data-act="log-open" data-id="'+esc(e.id)+'"><b>'+esc(e.name)+'</b><span class="mono muted" style="font-size:13px">'+esc(niceDate(e.date))+'</span><small>'+(e.rating?'<span class="starline">'+stars(e.rating)+'</span> ':'')+esc(bits.join(" · "))+(note?'<br>'+esc(note):'')+'</small></button>';}).join("")+'</div>';
}
function entryText(e){
  let s=e.name+" — "+niceDate(e.date);
  const meta=[];if(e.serv)meta.push("Serves "+e.serv);if(e.prep)meta.push("Prep "+e.prep+" min");if(e.cook)meta.push("Cook "+e.cook+" min");if(e.rating)meta.push("Rating "+e.rating+"/5");
  if(meta.length)s+="\n"+meta.join(" · ");
  if(e.ings.length)s+="\nIngredients used:\n"+e.ings.map(x=>"- "+(x.a?x.a+" ":"")+x.item).join("\n");
  if(e.notes)s+="\nNotes: "+e.notes;
  return s;
}

  (r?'<p class="muted" style="margin:0;font-size:13px">The recipe estimates '+fmtTime(r.t)+' total.'+(d.cook&&!d.id?' Cook time was filled in from cook mode.':'')+'</p>':'')+
  '<div class="field"><span class="lbl">How did it turn out?</span><div class="rate" role="group" aria-label="Rating">'+[1,2,3,4,5].map(n=>'<button type="button" data-act="log-rate" data-id="'+n+'" aria-pressed="'+(n<=d.rating)+'" aria-label="'+n+' out of 5">★</button>').join("")+'</div></div>'+
  '<div class="field"><label for="log-notes">Notes</label><textarea class="inp" id="log-notes" rows="5" placeholder="What worked, what you swapped, what to change next time">'+esc(d.notes)+'</textarea></div>'+
  '<div class="row"><button type="button" class="btn" data-act="log-save">Save entry</button>'+(d.id?'<button type="button" class="btn ghost danger" data-act="log-del">'+(top.confirmDel?"Tap again to delete":"Delete entry")+'</button>':'')+'</div>'+
  '</form>';
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case "tab":state.tab=id;state.stack=[];state.copyText=null;renderSheet();render();window.scrollTo(0,0);break;
    case "cat":state.cat=id;render();break;
    case "easy":state.easy=!state.easy;render();break;
    case "smode":state.smode=id;render();break;
    case "stype":state.stype=id;render();break;
    case "prot":state.protein=id;render();break;
    case "open-recipe":push("recipe",id);break;
    case "open-tech":push("tech",id);break;
    case "open-spice":push("spice",id);break;
    case "open-method":push("method",id);break;
    case "open-protein":state.tab="spices";state.smode="protein";state.protein=id;state.stack=[];renderSheet();render();window.scrollTo(0,0);break;
    case "back":state.stack.pop();renderSheet();render();break;
    case "fav":{const i=store.fav.indexOf(id);if(i>=0){store.fav.splice(i,1);toast("Removed from saved");}else{store.fav.push(id);toast("Saved to My Kitchen");}save();refreshSheet();render();break;}
    case "serv":{const r=R[id];const v=Math.min(48,Math.max(1,(state.serv[id]||r.s)+Number(b.dataset.d)));state.serv[id]=v;refreshSheet();break;}
    case "shop-add":{const r=R[id],f=factor(r);let n=0;r.i.forEach(x=>{const text=(amount(x,f)+" "+x[2]).trim();if(!store.shop.some(s=>s.text===text&&s.from===r.n)){store.shop.push({text,from:r.n,done:false});n++;}});save();toast(n?n+" items added to your shopping list":"Already on your list");break;}
    case "mark-cooked":if(store.cooked[id]){delete store.cooked[id];toast("Unmarked");}else{store.cooked[id]=today();toast("Nice work. Marked as cooked.");}save();refreshSheet();render();break;
    case "quiz":{state.quizPick=state.quizPick||{};const i=Number(b.dataset.i);state.quizPick[id]=i;if(i===T[id].a){store.quiz[id]=true;save();}refreshSheet();render();break;}
    case "cook-start":refreshSheet();/* stops a recipe-page video so two don't play at once */state.cook={id,i:0,started:Date.now()};lockScreen();renderCook();break;
    case "vid-play":{const v=VIDEOS[id];if(v)b.outerHTML=playerHTML(v,true);break;}
    case "cook-vid":state.cookVid=!state.cookVid;renderCookVideo();break;
    case "cook-next":state.cook.i++;renderCook();$("#cook .cook-main").scrollTop=0;break;
    case "cook-prev":if(state.cook.i>0)state.cook.i--;renderCook();break;
    case "cook-goto":state.cook.i=Number(id);renderCook();break;
    case "cook-close":state.cook=null;if(state.timer){clearInterval(state.timer.iv);state.timer=null;}try{wake&&wake.release();}catch(e){}renderCook();break;
    case "cook-finish":{const rid=state.cook.id,mins=Math.max(1,Math.round((Date.now()-(state.cook.started||Date.now()))/60000));store.cooked[rid]=today();save();state.cook=null;if(state.timer){clearInterval(state.timer.iv);state.timer=null;}try{wake&&wake.release();}catch(e){}renderCook();render();
      state.stack.push({type:"log",draft:newDraft(rid,mins)});renderSheet();toast(R[rid].n+" is done. Log what you used.");break;}
    case "install":if(installPrompt){const p=installPrompt;installPrompt=null;p.prompt();(p.userChoice||Promise.resolve()).then(c=>{if(c&&c.outcome==="accepted")b.hidden=true;else showInstall();},()=>{});}
      else{state.stack.push({type:"install"});renderSheet();}break;
    case "plan-week":{const n=Number(id);state.planWeek=n?isoOf(addDays(parseISO(curWeek()),n)):isoOf(mondayOf(new Date()));state.planClear=false;render();break;}
    case "plan-auto":{const n=autoFill();pruneOldPlan();save();render();toast(n?"Filled "+n+" day"+(n===1?"":"s")+". Swap anything you like.":"Every day already has a dish.");break;}
    case "plan-add":state.stack.push({type:"pick-recipe",day:id,q:""});renderSheet();break;
    case "plan-pick":{const t=state.stack[state.stack.length-1];addToPlan(t.day,id);state.stack.pop();renderSheet();render();const dt=parseISO(t.day);toast(R[id].n+" added to "+DAYNAMES[(dt.getDay()+6)%7]);break;}
    case "plan-day-pick":state.stack.push({type:"pick-day",rid:id});renderSheet();break;
    case "plan-pick-day":{const t=state.stack[state.stack.length-1],r=R[t.rid];addToPlan(id,t.rid,state.serv[t.rid]||r.s);state.stack.pop();renderSheet();render();const dt=parseISO(id);
      if(isoOf(mondayOf(dt))!==curWeek())state.planWeek=isoOf(mondayOf(dt));toast(r.n+" added to "+DAYNAMES[(dt.getDay()+6)%7]+", "+shortDate(dt));break;}
    case "plan-serv":{const l=store.plan[b.dataset.day],e=l&&l[Number(b.dataset.i)];if(e){e.serv=Math.min(48,Math.max(1,Number(e.serv)+Number(b.dataset.d)));save();render();}break;}
    case "plan-del":{const l=store.plan[b.dataset.day];if(l){const e=l.splice(Number(b.dataset.i),1)[0];if(!l.length)delete store.plan[b.dataset.day];save();render();if(e&&R[e.rid])toast(R[e.rid].n+" removed");}break;}
    case "plan-open":{const e=(store.plan[b.dataset.day]||[])[Number(b.dataset.i)];if(e&&R[e.rid]){state.serv[e.rid]=e.serv;push("recipe",e.rid);}break;}
    case "plan-clear":if(!state.planClear){state.planClear=true;render();break;}
      weekDays().forEach(d=>delete store.plan[d]);state.planClear=false;save();render();toast("Week cleared");break;
    case "plan-grocery":if(planEntries(weekDays()).length){state.stack.push({type:"grocery"});renderSheet();}break;
    case "grocery-send":{const days=weekDays(),from="Meal plan · week of "+shortDate(parseISO(days[0]));let n=0;
      buildGrocery(days).forEach(l=>{const text=l.name+" — "+l.amt;if(!store.shop.some(s=>s.text===text&&s.from===from)){store.shop.push({text,from,done:false});n++;}});
      save();render();toast(n?n+" items added to your shopping list in My Kitchen":"Already on your shopping list");break;}
    case "grocery-copy":{const days=weekDays(),text=groceryText(buildGrocery(days),"week of "+shortDate(parseISO(days[0])));const t=state.stack[state.stack.length-1];
      const fallback=()=>{t.copyText=text;refreshSheet();const ta=$("#grocfall");if(ta){ta.focus();ta.select();}};
      try{navigator.clipboard.writeText(text).then(()=>toast("Grocery list copied"),fallback);}catch(err){fallback();}
      break;}
    case "log-new":state.stack.push({type:"log",draft:newDraft(id||"","")});renderSheet();break;
    case "log-open":{const e=store.journal.find(x=>x.id===id);if(e){state.stack.push({type:"log",draft:JSON.parse(JSON.stringify(e))});renderSheet();}break;}
    case "log-row-add":{const t=syncDraft();t.draft.ings.push({a:"",item:""});refreshSheet();const rows=document.querySelectorAll("#sheet .log-a");if(rows.length)rows[rows.length-1].focus();break;}
    case "log-row-del":{const t=syncDraft();t.draft.ings.splice(Number(id),1);if(!t.draft.ings.length)t.draft.ings.push({a:"",item:""});refreshSheet();break;}
    case "log-fill":{const t=syncDraft(),r=R[t.draft.rid];if(r){const f=(Number(t.draft.serv)||r.s)/r.s;t.draft.ings=r.i.map(x=>({a:amount(x,f),item:x[2]}));}refreshSheet();break;}
    case "log-rate":{const t=syncDraft(),n=Number(id);t.draft.rating=t.draft.rating===n?0:n;refreshSheet();break;}
    case "log-save":{const t=syncDraft(),d=t.draft;
      if(!d.name.trim()){toast("Add the dish name first");const n=$("#log-name");n&&n.focus();break;}
      d.ings=d.ings.filter(x=>x.a.trim()||x.item.trim());
      if(d.id){const i=store.journal.findIndex(x=>x.id===d.id);if(i>=0)store.journal[i]=d;else store.journal.unshift(d);}
      else{d.id=Date.now().toString(36);store.journal.unshift(d);}
      store.journal.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      save();state.stack.pop();renderSheet();render();toast("Saved to your cooking journal");break;}
    case "log-del":{const t=state.stack[state.stack.length-1];if(!t.confirmDel){syncDraft();t.confirmDel=true;refreshSheet();break;}
      store.journal=store.journal.filter(x=>x.id!==t.draft.id);save();state.stack.pop();renderSheet();render();toast("Entry deleted");break;}
    case "journal-copy":{const text="Kayla's Kitchen cooking journal\n\n"+store.journal.map(entryText).join("\n\n----\n\n");
      const fallback=()=>{state.copyText=text;render();const ta=$("#copyfall");if(ta){ta.focus();ta.select();}};
      try{navigator.clipboard.writeText(text).then(()=>{state.copyText=null;toast("Journal copied");},fallback);}catch(err){fallback();}
      break;}
    case "timer-go":{const r=R[state.cook.id],i=state.cook.i,tm=state.timer;
      if(tm&&tm.id===r.id&&tm.step===i&&!tm.done&&tm.rem>0){tm.end=Date.now()+tm.rem*1000;tm.running=true;tm.iv=setInterval(tick,500);}
      else{startTimer(i,r.st[i][1]*60);state.timer.id=r.id;}
      renderCook();break;}
    case "timer-pause":{const tm=state.timer;clearInterval(tm.iv);tm.rem=Math.max(0,Math.round((tm.end-Date.now())/1000));tm.running=false;renderCook();break;}
    case "timer-reset":{const tm=state.timer;if(tm)clearInterval(tm.iv);state.timer=null;renderCook();break;}
    case "shop-remove":store.shop.splice(Number(id),1);save();render();break;
    case "shop-clear-done":store.shop=store.shop.filter(x=>!x.done);save();render();break;
    case "shop-clear-all":store.shop=[];state.copyText=null;save();render();break;
    case "shop-copy":{const groups={};store.shop.forEach(x=>{(groups[x.from]=groups[x.from]||[]).push((x.done?"[x] ":"[ ] ")+x.text);});
      const text="Kayla's Kitchen shopping list\n\n"+Object.entries(groups).map(([k,v])=>k+"\n"+v.join("\n")).join("\n\n");
      const fallback=()=>{state.copyText=text;render();const ta=$("#copyfall");if(ta){ta.focus();ta.select();}};
      try{navigator.clipboard.writeText(text).then(()=>{state.copyText=null;toast("Shopping list copied");},fallback);}catch(err){fallback();}
      break;}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.ing){const c=state.checked[t.dataset.ing]=state.checked[t.dataset.ing]||{};c[t.dataset.i]=t.checked;}
  if(t.dataset.shop!==undefined){store.shop[Number(t.dataset.shop)].done=t.checked;save();}
  if(t.id==="log-rid"){const top=syncDraft(),d=top.draft,r=R[d.rid];
    if(r){if(!d.name.trim()||RECIPES.some(x=>x.n===d.name))d.name=r.n;if(!d.serv)d.serv=String(r.s);
      if(d.ings.every(x=>!x.a.trim()&&!x.item.trim())){const f=(Number(d.serv)||r.s)/r.s;d.ings=r.i.map(x=>({a:amount(x,f),item:x[2]}));}}
    refreshSheet();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){state.q=e.target.value;$("#list").innerHTML=listHTML();}
  if(e.target.id==="pq"){const t=state.stack[state.stack.length-1];if(t&&t.type==="pick-recipe"){t.q=e.target.value;$("#pick-list").innerHTML=pickListHTML(t);}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(state.cook){$("[data-act=cook-close]").click();}else if(state.stack.length){state.stack.pop();renderSheet();render();}}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&state.cook)lockScreen();});

render();
})();
</script>

<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
</body>
